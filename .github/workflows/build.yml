# Runs on every push and every pull request. It only proves that the code is
# sound, it never publishes anything; see release.yml for that.
name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          # The version is taken from go.mod, so it cannot drift from it.
          go-version-file: go.mod
          cache: true

      - name: Check the formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'ed:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race ./...

  image:
    name: Build the image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Built but never pushed. Without this the release would be the first
      # time the Dockerfile is exercised.
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
