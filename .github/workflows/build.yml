# Runs on every push and every pull request. It only proves that the code is
# sound, it never publishes anything; see release.yml for that.
name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  # Two runs of the same branch would race for the badge file, and a superseded
  # run is not worth the minutes.
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Test and build
    runs-on: ubuntu-latest
    permissions:
      # Write is needed to commit the coverage badge back into main.
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          # The version is taken from go.mod, so it cannot drift from it.
          go-version-file: go.mod
          cache: true

      - name: Check the formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'ed:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Unit test
        run: go test -race ./...

      # One run with the integration tag covers the unit tests and the
      # integration tests, so the profile describes the whole application.
      # -coverpkg attributes what the integration tests reach to the packages
      # they exercise, instead of to the test package itself. Needs a Docker
      # daemon for testcontainers, which the runner provides.
      - name: Test with coverage
        run: |
          go test -tags=integration \
            -covermode=atomic \
            -coverpkg=./internal/...,./utils/... \
            -coverprofile=coverage.out \
            ./...

      # Writes the breakdown into the summary of the run and, on main, commits
      # the badge into main itself. GitHub has no coverage feature of its own,
      # so the badge has to be a file somewhere; this keeps it in the repository
      # instead of in a third party service.
      #
      # The commit is made through the API with GITHUB_TOKEN, and a push from
      # that token does not start another workflow, so this cannot loop.
      - name: Coverage summary and badge
        uses: vladopajic/go-test-coverage@v2.19.0
        with:
          profile: coverage.out
          # An empty token turns the badge off, so only main writes one.
          git-token: ${{ github.ref_name == 'main' && secrets.GITHUB_TOKEN || '' }}
          git-branch: main
          # Without this the path would carry the branch name a second time, as
          # '.badges/main/coverage.svg' inside the main branch.
          git-file-name: .badges/coverage.svg

      - name: Coverage report
        run: go tool cover -html=coverage.out -o coverage.html

      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            coverage.out
            coverage.html
          retention-days: 14

  image:
    name: Build the image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Built but never pushed. Without this the release would be the first
      # time the Dockerfile is exercised.
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
